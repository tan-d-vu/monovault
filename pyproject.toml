[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicvault"
version = "0.1.0"
description = "Lightweight music file manager with categorization"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "mutagen>=1.47.0",
    "librosa>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM117",
    "RUF001",
    "RUF005",
    "RUF012",
]